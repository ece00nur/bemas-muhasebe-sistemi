<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Bemas Muhasebe - Sunucu Bağlantısı</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f8; color: #1c2530;
  }
  .card {
    background: #fff; border: 1px solid #e1e5ea; border-radius: 10px;
    padding: 28px; width: 100%; max-width: 420px;
  }
  h2 { margin: 0 0 6px; font-size: 18px; }
  p.hint { color: #6b7684; font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: #6b7684; margin-bottom: 4px; }
  input {
    width: 100%; padding: 9px 10px; border: 1px solid #e1e5ea; border-radius: 6px;
    font-size: 14px; box-sizing: border-box;
  }
  button {
    width: 100%; margin-top: 14px; background: #1f4e78; color: #fff; border: none;
    padding: 10px 16px; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #123049; }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: #d93025; font-size: 13px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h2>Sunucuya Bağlanılamadı</h2>
    <p class="hint">
      Bu bilgisayar, muhasebe verilerinin tutulduğu sunucuya ulaşamadı. Sunucunun
      çalıştığı bilgisayarın adresini girip "Bağlan"a basın - bir daha
      sormayacağız.
    </p>
    <form id="setupForm">
      <label>Sunucu Adresi</label>
      <input id="urlInput" placeholder="http://192.168.1.10:8000" required>
      <button id="submitBtn" type="submit">Bağlan</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const input = document.getElementById("urlInput");
  input.value = params.get("url") || "http://localhost:8000";

  const form = document.getElementById("setupForm");
  const btn = document.getElementById("submitBtn");
  const errorMsg = document.getElementById("errorMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Bağlanılıyor...";
    errorMsg.textContent = "";
    try {
      const result = await window.bemasSetup.testAndSaveServerUrl(input.value);
      if (!result.ok) {
        errorMsg.textContent = result.error;
        btn.disabled = false;
        btn.textContent = "Bağlan";
      }
      // On success the main process navigates this window away - nothing more to do here.
    } catch (err) {
      errorMsg.textContent = "Beklenmeyen bir hata oluştu.";
      btn.disabled = false;
      btn.textContent = "Bağlan";
    }
  });
</script>
</body>
</html>

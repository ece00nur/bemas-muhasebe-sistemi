# Bemas Treyler dagitim sayfasi - melina.com.tr icin Nginx yapilandirmasi
#
# Bu blogu melina.com.tr icin mevcut server{} bloguna ekleyin (ayri bir server
# blogu DEGIL - ayni domainin mevcut HTTPS server{} blogunun icine).
# Site kok dizini varsayimi: /var/www/melina.com.tr/public_html
#
# Dizin yapisi:
#   /var/www/melina.com.tr/public_html/bemas-muhasebe/index.html
#   /var/www/melina.com.tr/public_html/bemas-muhasebe/downloads/bemas-setup-latest.exe
#   /var/www/melina.com.tr/public_html/bemas-muhasebe/downloads/bemas-setup-v1.0.0.exe
#   /var/www/melina.com.tr/public_html/bemas-muhasebe/downloads/*.sha256
#   /var/www/melina.com.tr/public_html/bemas-muhasebe/downloads/CHANGELOG.txt

server {
    listen 443 ssl http2;
    server_name melina.com.tr www.melina.com.tr;

    root /var/www/melina.com.tr/public_html;
    index index.html;

    # ... mevcut ssl_certificate / ssl_certificate_key / diger site kurallariniz ...

    # ---- Iniş (landing) sayfasi: /bemas-muhasebe/ ----
    location /bemas-muhasebe/ {
        alias /var/www/melina.com.tr/public_html/bemas-muhasebe/;
        try_files $uri $uri/ /bemas-muhasebe/index.html;

        # Sayfa hafif ve sik guncellenebilir oldugu icin kisa cache.
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN";

        # index.html'in kendisi arama motorlarina kapali (dahili portal).
        add_header X-Robots-Tag "noindex, nofollow";
    }

    # ---- Kurulum dosyalari: /bemas-muhasebe/downloads/*.exe|*.msi|*.zip ----
    # Dogru MIME turleri - tarayici bu dosyalari calistirmaya CALISMAZ,
    # dogrudan "farkli kaydet" indirmesi baslatir. NOT: nginx location
    # eslesmesinde regex bloklar, "^~" olmayan prefix bloktan once
    # degerlendirilir; bu yuzden asagidaki iki regex blok, genel prefix
    # blogundan ONCE tanimlanmis olmasina bakilmaksizin oncelikli eslesir.

    # "latest" kopya dosyasi siklikla degistigi icin kisa cache.
    location ~* ^/bemas-muhasebe/downloads/.+-latest\.(exe|msi|zip)$ {
        alias /var/www/melina.com.tr/public_html/bemas-muhasebe/downloads/;
        types { application/octet-stream exe msi; application/zip zip; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Disposition 'attachment';
        add_header X-Content-Type-Options "nosniff";
    }

    # Versiyon numarali dosya adlari (bemas-setup-v1.0.0.exe) asla degismez,
    # bu yuzden uzun sureli/immutable cache guvenlidir.
    location ~* ^/bemas-muhasebe/downloads/.+-v[0-9][0-9.]*\.(exe|msi|zip)$ {
        alias /var/www/melina.com.tr/public_html/bemas-muhasebe/downloads/;
        types { application/octet-stream exe msi; application/zip zip; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition 'attachment';
        add_header X-Content-Type-Options "nosniff";
    }

    # Genel fallback: CHANGELOG.txt, *.sha256 gibi metin dosyalari + yukaridaki
    # regex bloklarla eslesmeyen her ihtimal.
    location /bemas-muhasebe/downloads/ {
        alias /var/www/melina.com.tr/public_html/bemas-muhasebe/downloads/;
        types {
            application/octet-stream exe msi;
            application/zip          zip;
            text/plain               txt sha256;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff";
        autoindex off;
    }

    # Buyuk .exe yuklemeleri icin gövde boyutu limiti (varsayilan 1m'yi asar).
    client_max_body_size 0;
}

